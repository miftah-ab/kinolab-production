name: Build Claude Skill ZIP
on:
  push:
    paths:
      - '.github/workflows/build-claude-skill-zip.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package standalone Claude skill
        run: |
          mkdir -p dist/kinolab-production
          cp -a .claude/skills/kinolab-production/. dist/kinolab-production/
          cd dist
          zip -r ../kinolab-production.zip kinolab-production
      - uses: actions/upload-artifact@v4
        with:
          name: kinolab-production-claude-skill
          path: kinolab-production.zip
          retention-days: 3
